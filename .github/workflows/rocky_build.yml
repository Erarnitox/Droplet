name: Build Project on Rocky Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9  # Use Rocky Linux 9 as the container environment

    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release --allowerasing  # Enable EPEL repository for extra packages
          dnf update -y --allowerasing
          dnf install -y wget curl jq sed git zip unzip openssl openssl-devel openssl-libs zlib zlib-devel postgresql postgresql-devel --allowerasing
          
      - name: Install CMake
        run: |
          CMAKE_VERSION=$(curl -s https://api.github.com/repos/Kitware/CMake/releases/latest | jq -r ".tag_name" | sed 's/v//')
          wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh
          chmod +x cmake-${CMAKE_VERSION}-linux-x86_64.sh
          ./cmake-${CMAKE_VERSION}-linux-x86_64.sh --skip-license --prefix=/usr/local
          rm cmake-${CMAKE_VERSION}-linux-x86_64.sh
          
      - name: Install Ninja
        run: |
          NINJA_VERSION=1.13.0  # Specify the desired version of Ninja
          wget https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip
          unzip ninja-linux.zip
          chmod +x ninja
          mv ninja /usr/local/bin/
          rm ninja-linux.zip

      - name: Install Clang
        run: |
          dnf install -y clang clang-devel clang-tools-extra ccache --allowerasing

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Restore CPM source cache
        uses: actions/cache@v5
        with:
          path: .cpm-cache
          # CPM downloads (poco, curl, libpqxx, cpr, Catch2) only change when a
          # CMakeLists/CPM version changes, never because of ordinary source edits.
          key: cpm-${{ runner.os }}-${{ hashFiles('src/**/CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # Caching the build/ directory does not give incremental builds: actions/checkout
      # gives every source file a fresh mtime, so ninja would rebuild everything anyway.
      # ccache keys on file *content*, so it works across fresh checkouts.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure and Build with CMake
        env:
          CC: clang
          CXX: clang++
          OPENSSL_ROOT_DIR: /usr/include/openssl
          ZLIB_LIBRARY: /usr/lib64/libz.so
          PostgreSQL_ROOT: /usr/include/pgsql
          CCACHE_MAXSIZE: 600M
          CCACHE_COMPILERCHECK: content
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CPM_SOURCE_CACHE="$GITHUB_WORKSPACE/.cpm-cache"
          ccache --zero-stats
          cmake -DZLIB_LIBRARY=$ZLIB_LIBRARY -DPostgreSQL_ROOT=$PostgreSQL_ROOT \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                --preset github
          cmake --build build
          ccache --show-stats
          strip build/droplet

      # Save even when the build failed, so the objects compiled so far are kept.
      # Only on main: PR caches would be scoped to the PR ref and just churn the 10 GB quota.
      - name: Save ccache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      # Deployment steps
      - name: Copy binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "build/droplet"
          target: /services/droplet/
      
      # Restart the droplet systemd service
      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: systemctl restart droplet